<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pilih Game</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1.5rem;
                padding: 1rem;
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                background: #0f172a;
                color: #e2e8f0;
            }

            h1 {
                margin: 0;
                text-align: center;
            }

            .subjudul {
                margin: -1rem 0 0;
                color: #94a3b8;
                text-align: center;
            }

            .daftar-game {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 1rem;
                width: min(720px, 100%);
            }

            .kartu {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
                padding: 1.5rem 1rem;
                border-radius: 14px;
                background: #1e293b;
                border: 2px solid transparent;
                color: inherit;
                text-decoration: none;
                text-align: center;
                transition: transform 0.15s, border-color 0.15s;
            }

            .kartu:hover,
            .kartu:focus-visible {
                transform: translateY(-4px);
                border-color: var(--warna);
            }

            .ikon {
                font-size: 3.5rem;
                line-height: 1;
            }

            .kartu h2 {
                margin: 0;
                font-size: 1.2rem;
                color: var(--warna);
            }

            .kartu p {
                margin: 0;
                color: #94a3b8;
                font-size: 0.9rem;
            }
        </style>
    </head>
    <body>
        <h1>🎮 Pilih Game</h1>
        <p class="subjudul">Klik salah satu game untuk mulai bermain</p>

        <main class="daftar-game">
            <a class="kartu" href="snake.html" style="--warna: #4ade80">
                <span class="ikon">🐍</span>
                <h2>Snake</h2>
                <p>Makan sebanyak mungkin tanpa menabrak dinding atau badan sendiri.</p>
            </a>

            <a class="kartu" href="banteng.html" style="--warna: #f59e0b">
                <span class="ikon">🐂</span>
                <h2>Dikejar Banteng</h2>
                <p>Lari dan hindari serudukan banteng selama mungkin.</p>
            </a>

            <a class="kartu" href="padel.html" style="--warna: #facc15">
                <span class="ikon">🎾</span>
                <h2>Main Padel</h2>
                <p>Lawan komputer di lapangan padel berdinding kaca.</p>
            </a>
        </main>
    </body>
</html>
